project:
  type: website
  output-dir: _site

website:
  title: "Pixel Process"
  description: "Think Clearly | Build Carefully | Apply Rigorously"
  favicon: favicon.ico
  
  navbar:
    background: primary
    logo: assets/logo.png
    left:
      - text: "Projects"
        href: projects/index.qmd
      - text: "Workflow"
        href: workflow/index.qmd
      - text: "Foundations"
        href: foundations/index.qmd
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/pixel-process-dev
        aria-label: GitHub
      - text: "Contact"
        href: contact.qmd
  
  page-footer:
    left: |
      Built with [Quarto](https://quarto.org)
    center: |
      Pixel Process (PxP) | Think Clearly | Build Carefully | Apply Rigorously
    right:
      - text: "Dexterous Data Consulting"
        href: https://dexterousdata.com
        
  sidebar:
    - id: foundations-nav
      title: "Foundations"
      style: "floating"
      collapse-level: 2
      contents:
        - foundations/index.qmd
        - section: "Try Python"
          href: foundations/try-python/index.qmd
          contents:
            - foundations/try-python/datatypes-operators.qmd
            - foundations/try-python/variables-functions.qmd
            - foundations/try-python/iteration-flow-control.qmd
            - foundations/try-python/errors-experimentation.qmd
        - section: "Explore Data"
          href: foundations/explore-data/index.qmd
          contents:
            - text: "Hello World"
              href: https://pixel-process-dev.github.io/explore-data-lite/lab/index.html?path=hello-world.ipynb
            - text: "Expert Debugger"
              href: https://pixel-process-dev.github.io/explore-data-lite/lab/index.html?path=expert-debugger.ipynb
            - text: "Dataset Basics"
              href: https://pixel-process-dev.github.io/explore-data-lite/lab/index.html?path=dataset-basics.ipynb
            - text: "Visualization Basics"
              href: https://pixel-process-dev.github.io/explore-data-lite/lab/index.html?path=visualization-basics.ipynb
            - text: "Visualization Building Blocks"
              href: https://pixel-process-dev.github.io/explore-data-lite/lab/index.html?path=visualization-building-blocks.ipynb
            - text: "Image Basics"
              href: https://pixel-process-dev.github.io/explore-data-lite/lab/index.html?path=image-basics.ipynb
        - text: "Build Models"
          href: foundations/build-models/index.qmd
          contents:
            - text: "Combining Colors: Sampling Analysis"
              href: https://mybinder.org/v2/gh/pixel-process-dev/binder-combining-colors/main?labpath=combining-colors.ipynb
              target: "_blank"
            - text: "Random Forest: Deep Dive"
              href: https://mybinder.org/v2/gh/pixel-process-dev/binder-random-forest/main?labpath=random-forest.ipynb
              target: "_blank"


format:
  html:
    theme:
      light: [flatly, custom.scss]
      dark: [darkly, custom.css]
    google-fonts:
      - Inter
    include-after-body:
      - assets/html/custom-footer.html
      - assets/html/umami.html
    link-external-newwindow: true
    toc: true
    toc-depth: 3
    code-copy: true
    code-fold: false

execute:
  freeze: auto
